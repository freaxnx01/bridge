name: web

on:
  push:
    branches: [main]
  pull_request:

# The cockpit SPA (web/) has its own Vitest suite and Vite build. go.yml only
# runs `go test`, so without this job frontend changes reach main ungated.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: vitest
        run: npx vitest --run
      - name: build
        run: npm run build
