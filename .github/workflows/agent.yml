name: Claude
on:
  issues:
    types: [labeled]

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      pipeline-ref: v2
      pre-preview: true
      # A floor only, at v2: classify-turns.sh sizes the budget from the
      # issue body's `### Task N` count, and a `turns:<N>` label overrides
      # both. This value applies only to an issue whose plan has no countable
      # task headings. Kept at 120 because the tier for a 4-task plan is what
      # issue #235 needed after failing outright at the old 30-turn cap.
      max-turns: 120
      # Wall-clock caps. The process cap must stay below the job cap so the
      # job still gets to report a result instead of dying mid-step.
      #
      # These are not defaults-with-a-margin, they are a fix: the action's own
      # 10-minute default SIGKILLed issue #254's run at exactly 10:00 with
      # `exit 124`, nowhere near its turn budget. Two MultiEdits had landed,
      # nothing was ever pushed, and the truncated result file surfaced only
      # as "RESULT_FILE is not valid JSON" — so the pipeline posted no run
      # report and the issue looked untouched. A multi-task Go plan running
      # `go test -race` per task does not fit in ten minutes.
      timeout-minutes: 50
      claude-timeout-minutes: 45
