name: Claude
on:
  issues:
    types: [labeled]

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      pipeline-ref: v1
      pre-preview: true
      # v1 has no auto turn-budget heuristic (classify-turns.sh is unreleased,
      # main-only as of 2026-08-12) — its default max-turns is 30, too low
      # for a multi-task /enrich plan (issue #235's 4-task plan hit
      # error_max_turns with nothing committed). 120 matches the heuristic's
      # own tier for a 4-task plan once that feature ships.
      max-turns: 120
